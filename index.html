<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>

  <body>
    <main>
      <div class="visa-card">
        <div id="card-number">
          <div class="card-number-name">Card Number:</div>
          <div class="card-number-write"></div>
        </div>

        <div class="card-holder-exp">
          <div id="card-holder">
            <div class="card-holder-name">Card Holder:</div>
            <div class="card-holder-write"></div>
          </div>
          <div id="card-expiration">
            <div class="card-exp-name">Card Expiration:</div>
            <div class="card-exp-write">
              <div class="card-exp-write-year"></div>
              <div class="card-exp-spilt">&nbsp;&nbsp;/&nbsp;</div>
              <div class="card-exp-write-month"></div>
            </div>
          </div>
        </div>

        <div class="visa-card-reverse">
          <div class="line"></div>
          <div class="visa-card-cvv2">
            <div class="visa-card-cvv2-name">Card CVV2:</div>
            <div class="visa-card-cvv2-write"></div>
          </div>
        </div>
      </div>

      <div class="visa-card-info">
        <form class="info-form">
          <div class="column-inp">
            <label for="card-info-number">Card Number:</label>
            <input type="text" id="card-info-number" name="card-info-number" />
          </div>

          <div class="column-inp">
            <label for="card-info-holders">Card Holder:</label>
            <input
              type="text"
              id="card-info-holders"
              name="card-info-holders"
            />
          </div>

          <div class="row-inp">
            <div class="expiration-inp">
              <label for="card-info-year">Card Expiration:</label>

              <select name="card-info-year" id="card-info-year">
                <option value="year" selected disabled>year</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
                <option value="2031">2031</option>
                <option value="2032">2032</option>
                <option value="2033">2033</option>
                <option value="2034">2034</option>
                <option value="2035">2035</option>
                <option value="2036">2036</option>
                <option value="2037">2037</option>
              </select>

              <select name="card-info-month" id="card-info-month">
                <option value="month" selected disabled>month</option>
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
              </select>
            </div>

            <div class="cvv2-inp">
              <label for="card-info-cvv2">Card cvv2:</label>
              <input type="text" id="card-info-cvv2" name="card-info-cvv2" />
            </div>
          </div>

          <div id="submit-inp">
            <input type="submit" value="send" />
          </div>
        </form>
      </div>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
